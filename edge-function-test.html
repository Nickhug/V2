<!DOCTYPE html>
<html>
<head>
  <title>Supabase Edge Function Test</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      color: #3ECF8E;
    }
    pre {
      background-color: #f4f4f4;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    button {
      background-color: #3ECF8E;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #32A875;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Supabase Edge Function Test</h1>
  <p>This page tests direct invocation of your Supabase Edge Function.</p>
  
  <button id="testFunction">Test Edge Function</button>
  
  <h3>Response:</h3>
  <pre id="response">Click the button to test...</pre>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize the Supabase client
      const supabaseUrl = 'https://ubvxaqceclhgflosgvai.supabase.co';
      // Use the anon key for this test
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVidnhhcWNlY2xoZ2Zsb3NndmFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEwNDY5NDIsImV4cCI6MjA1NjYyMjk0Mn0.qRK2OsTAcMY7WfznhOIAonFqHTj5CLyKuASwqGqOllU';
      // Access the global Supabase object from the CDN
      const client = window.supabase.createClient(supabaseUrl, supabaseKey);
      
      const responseElement = document.getElementById('response');
      
      // Test the Edge Function
      document.getElementById('testFunction').addEventListener('click', async function() {
        responseElement.textContent = 'Loading...';
        responseElement.className = '';
        
        try {
          console.log('Invoking Edge Function...');
          const { data, error } = await client.functions.invoke('hello-world', {
            body: { name: 'Direct Browser Test' }
          });
          
          if (error) {
            console.error('Error:', error);
            responseElement.textContent = `Error: ${error.message || JSON.stringify(error)}`;
            responseElement.className = 'error';
            return;
          }
          
          console.log('Response:', data);
          responseElement.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          console.error('Exception:', err);
          responseElement.textContent = `Exception: ${err.message}`;
          responseElement.className = 'error';
        }
      });
    });
  </script>
</body>
</html>
